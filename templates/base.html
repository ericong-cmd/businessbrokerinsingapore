<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}Business Listings Finder{% endblock %} — The Funding Assembly</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
  <style>
    body { background: #f8f9fa; font-family: 'Segoe UI', system-ui, sans-serif; }
    .navbar { background: #1a1a2e !important; }
    .navbar-brand { font-weight: 700; letter-spacing: -.5px; color: #fff !important; }
    .navbar-brand span { color: #f0a500; }
    .stat-card { border: none; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    .source-badge { font-size: .75rem; font-weight: 600; padding: 3px 8px; border-radius: 20px; }
    .table th { font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; color: #6c757d; font-weight: 600; }
    .table td { vertical-align: middle; font-size: .9rem; }
    .listing-title-link { font-weight: 600; color: #1a1a2e; text-decoration: none; }
    .listing-title-link:hover { color: #f0a500; }
    .price-badge { background: #e8f5e9; color: #2e7d32; font-weight: 600; padding: 3px 8px; border-radius: 6px; font-size: .82rem; }
    .scrape-btn { min-width: 130px; }
    .progress-section { display: none; }
    .spinner-sm { width: 1rem; height: 1rem; }
    #toast-container { position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 9999; }
    .source-bizbuysell     { background: #cfe2ff; color: #084298; }
    .source-businessesforsale { background: #d1e7dd; color: #0f5132; }
    .source-matchasia      { background: #ffe5d0; color: #7c3000; }
    .source-acquire        { background: #e2d9f3; color: #432874; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
<nav class="navbar navbar-dark px-4 py-3 mb-4">
  <a class="navbar-brand" href="/">
    <i class="bi bi-buildings me-2"></i>Business Listings <span>Finder</span>
  </a>
  <div class="d-flex align-items-center gap-3">
    <span class="text-white-50 small">The Funding Assembly</span>
    <a href="/export.csv" class="btn btn-sm btn-outline-light">
      <i class="bi bi-download me-1"></i>Export CSV
    </a>
  </div>
</nav>

<div class="container-fluid px-4">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="alert alert-{{ cat }} alert-dismissible fade show">{{ msg }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</div>

<div id="toast-container"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
function showToast(msg, type='success') {
  const el = document.createElement('div');
  el.className = `toast align-items-center text-bg-${type} border-0 show mb-2`;
  el.setAttribute('role', 'alert');
  el.innerHTML = `<div class="d-flex"><div class="toast-body">${msg}</div>
    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div>`;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => el.remove(), 5000);
}
</script>
{% block scripts %}{% endblock %}
</body>
</html>
